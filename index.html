<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | Piyush Raikwar</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <center>
        <h1>Play Time</h1>
        <h2>Tic Tac Toe</h2>
    </center>
    <div class="gameContiner">
        <div class="container">
            <div class="cell bt-0 bl-0" ></div>
            <div class="cell bt-0" ></div>
            <div class="cell bt-0 br-0" ></div>
            <div class="cell bl-0" ></div>
            <div class="cell" ></div>
            <div class="cell  br-0" ></div>
            <div class="cell bl-0 bb-0" ></div>
            <div class="cell bb-0" ></div>
            <div class="cell bb-0 br-0" ></div>
        </div>
        <div class="controls">
            <div class="start">
                <button id="strt">Start</button>
            </div>
            <div class="info">
                <p id="turnstmnt"></p>
            </div>

        </div>
    </div>

</body>
<script src="script.js"></script>
</html>
